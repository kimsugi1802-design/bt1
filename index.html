<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Responsive Web Design Project - Mai Phương</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bộ Sưu Tập Nhiếp Ảnh &amp; Cuộc Sống</h1>
        <p>Khám phá không gian thiết kế đáp ứng thích ứng theo từng khung nhìn và sở thích cá nhân.</p>
    </header>

    <main class="grid-container">
        <figure class="figure-card">
            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80" alt="Máy ảnh cổ điển đặt trên bàn làm việc gỗ">
            <figcaption>Khoảnh khắc hoài niệm với những thiết bị cơ khí tinh xảo, ghi lại dấu ấn thời gian.</figcaption>
        </figure>

        <figure class="figure-card">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Chân dung góc nhìn tối giản ánh sáng tự nhiên">
            <figcaption>Sự tĩnh lặng trong không gian sống hiện đại, nơi ánh sáng và bóng tối giao hòa.</figcaption>
        </figure>

        <figure class="figure-card">
            <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=600&q=80" alt="Không gian làm việc sáng tạo với laptop và máy ảnh">
            <figcaption>Góc làm việc năng động của một sinh viên thương mại điện tử yêu thích sự sáng tạo số.</figcaption>
        </figure>

        <figure class="figure-card">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80" alt="Phong cảnh thiên nhiên hùng vĩ dưới ánh hoàng hôn">
            <figcaption>Hành trình khám phá những vùng đất mới, nạp đầy năng lượng sau giờ học căng thẳng.</figcaption>
        </figure>

        <figure class="figure-card">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=600&q=80" alt="Rừng cây xanh mát ngập tràn ánh nắng ban mai">
            <figcaption>Hít thở bầu không khí trong lành, tìm lại cân bằng và sự thư thái trong tâm hồn.</figcaption>
        </figure>
    </main>

</body>
</html>
